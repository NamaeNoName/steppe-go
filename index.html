<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Steppe Go - Nomadic Adventure</title>
    <style>
        :root {
            --bg-color: #f4e4bc;
            --steppe-dark: #3e2723;
            --accent: #d4a017;
            --player-blue: #2980b9;
            --enemy-red: #c0392b;
        }

        body {
            margin: 0; background-color: #1a1a1a; color: var(--steppe-dark);
            font-family: 'Verdana', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #game-window {
            width: 380px; height: 660px; background: var(--bg-color);
            border: 8px solid var(--steppe-dark); border-radius: 30px;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Экран смерти (новый слой) */
        #death-screen {
            position: absolute; width: 100%; height: 100%; 
            background: rgba(62, 39, 35, 0.95); z-index: 100;
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; color: white; text-align: center;
        }

        .header {
            background: var(--steppe-dark); color: white;
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
        }

        #visual-area {
            height: 220px; background: #e0c9a6; 
            display: flex; justify-content: center; align-items: center;
            border-bottom: 2px solid var(--steppe-dark); position: relative;
        }

        .sprite { width: 80px; height: 80px; border-radius: 15px; position: relative; border: 3px solid white; }
        .player { background: var(--player-blue); }
        .enemy { background: var(--enemy-red); display: none; }

        #story-box {
            flex-grow: 1; padding: 20px; font-size: 16px; line-height: 1.4;
            overflow-y: auto; background: rgba(255,255,255,0.3);
        }

        .controls { background: var(--steppe-dark); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 18px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-main { background: var(--accent); color: var(--steppe-dark); }
        .btn-choice { background: #ecf0f1; color: var(--steppe-dark); }

        .hp-bar { width: 100%; height: 8px; background: #000; position: absolute; top: -15px; border-radius: 4px; }
        .hp-fill { height: 100%; background: #2ecc71; width: 100%; border-radius: 4px; transition: width 0.2s; }
        .stat-val { font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div id="game-window">
    <div id="death-screen">
        <h1 style="color:var(--enemy-red);">КОНЕЦ ПУТИ</h1>
        <p>Ваше кочевье закончилось...<br>Вы пали в бескрайней степи.</p>
        <button class="btn-main" onclick="location.reload()">Начать заново</button>
    </div>

    <div id="start-screen" style="position:absolute; width:100%; height:100%; background:var(--steppe-dark); z-index:10; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white;">
        <h1 style="color:var(--accent); font-size:40px;">STEPPE GO</h1>
        <p>Путь кочевника</p>
        <button class="btn-main" onclick="initGame()">Начать кочевье</button>
    </div>

    <div class="header">
        <div>День: <span id="day-num" class="stat-val">1</span></div>
        <div>HP: <span id="hp-val" class="stat-val">100</span></div>
        <div>Золото: <span id="gold-val" class="stat-val">0</span></div>
    </div>

    <div id="visual-area">
        <div id="player-sprite" class="sprite player">
            <div class="hp-bar"><div id="p-hp-bar" class="hp-fill"></div></div>
        </div>
        <div style="width: 40px;"></div>
        <div id="enemy-sprite" class="sprite enemy">
            <div class="hp-bar"><div id="e-hp-bar" class="hp-fill"></div></div>
        </div>
    </div>

    <div id="story-box">Бескрайняя степь ждет тебя...</div>

    <div class="controls" id="action-panel"></div>
</div>

<script>
    let player = { hp: 100, maxHp: 100, gold: 0, day: 1, atk: 12 };
    let enemy = { hp: 0, maxHp: 0, atk: 0 };
    let isPaused = false;
    let isGameOver = false;
    let fightInterval = null;

    function initGame() {
        document.getElementById('start-screen').style.display = 'none';
        updateUI();
        showMainButton();
    }

    // ЕДИНАЯ СИСТЕМА ИЗМЕНЕНИЯ ХАРАКТЕРИСТИК (ЗАЩИТА ОТ БАГОВ)
    function changeStats(hpChange = 0, goldChange = 0, dayChange = 0) {
        if (isGameOver) return;

        let nextHp = player.hp + hpChange;
        player.gold += goldChange;
        player.day += dayChange;

        if (nextHp <= 0) {
            player.hp = 0;
            isGameOver = true;
            updateUI();
            triggerGameOver();
            return;
        }

        player.hp = Math.min(nextHp, player.maxHp);
        updateUI();
    }

    function updateUI() {
        const displayHp = Math.max(0, Math.ceil(player.hp));
        document.getElementById('day-num').innerText = player.day;
        document.getElementById('hp-val').innerText = displayHp;
        document.getElementById('gold-val').innerText = player.gold;
        document.getElementById('p-hp-bar').style.width = (displayHp / player.maxHp * 100) + "%";
    }

    function triggerGameOver() {
        clearInterval(fightInterval);
        document.getElementById('death-screen').style.display = 'flex';
    }

    function showMainButton() {
        if (isGameOver) return;
        document.getElementById('action-panel').innerHTML = `<button class="btn-main" onclick="nextDay()">Следующий день (В путь)</button>`;
    }

    function nextDay() {
        changeStats(0, 0, 1);
        if (!isGameOver) generateEvent();
    }

    const events = [
        {
            text: "На горизонте показалась одинокая юрта. Из неё пахнет свежим кумысом.",
            choices: [
                { text: "Зайти на отдых (+20 HP)", action: () => { changeStats(20); endEvent("Вы отдохнули и послушали сказы старика."); } },
                { text: "Проехать мимо", action: () => { endEvent("Путь продолжается."); } }
            ]
        },
        {
            text: "Вы встретили торговый караван, идущий по Шелковому пути.",
            choices: [
                { text: "Продать припасы (+15 Золота)", action: () => { changeStats(0, 15); endEvent("Торговцы щедро заплатили."); } },
                { text: "Обменяться новостями", action: () => { endEvent("Вы узнали, что впереди спокойные земли."); } }
            ]
        },
        {
            text: "Путь преградил степной волк. Он выглядит голодным.",
            isBattle: true,
            eHP: 40,
            eAtk: 8
        },
        {
            text: "Древний каменный балбал (изваяние) стоит посреди равнины.",
            choices: [
                { text: "Почтить предков (+ Сила)", action: () => { player.atk += 2; endEvent("Вы чувствуете прилив сил."); } },
                { text: "Искать клад под ним", action: () => { 
                    if(Math.random() > 0.5) { changeStats(0, 30); endEvent("Вы нашли старые монеты!"); }
                    else { changeStats(-15); endEvent("Камень обрушился, придавив вам ногу (-15 HP)"); }
                }}
            ]
        },
        {
            text: "Начался сильный буран. Видимость почти нулевая.",
            choices: [
                { text: "Переждать (Теряем день)", action: () => { changeStats(0, 0, 1); endEvent("Буран утих, но время потеряно."); } },
                { text: "Идти сквозь бурю (-20 HP)", action: () => { changeStats(-20); endEvent("Вы вышли к тропе, но сильно замерзли."); } }
            ]
        }
    ];

    function generateEvent() {
        const rnd = Math.floor(Math.random() * events.length);
        const ev = events[rnd];
        
        document.getElementById('story-box').innerHTML = `<strong>День ${player.day}:</strong><br>${ev.text}`;

        const panel = document.getElementById('action-panel');
        panel.innerHTML = '';

        if (ev.isBattle) {
            setupBattle(ev);
        } else {
            ev.choices.forEach(c => {
                const b = document.createElement('button');
                b.className = "btn-choice";
                b.innerText = c.text;
                b.onclick = c.action;
                panel.appendChild(b);
            });
        }
    }

    function setupBattle(ev) {
        enemy.hp = ev.eHP;
        enemy.maxHp = ev.eHP;
        enemy.atk = ev.eAtk;
        
        document.getElementById('enemy-sprite').style.display = 'block';
        document.getElementById('e-hp-bar').style.width = "100%";
        
        const panel = document.getElementById('action-panel');
        panel.innerHTML = `
            <button class="btn-main" style="background:#c0392b; color:white;" onclick="startAutoBattle()">Вступить в бой</button>
            <button class="btn-choice" onclick="retreat()">Попробовать обойти (-10 HP)</button>
        `;
    }

    function startAutoBattle() {
        document.getElementById('action-panel').innerHTML = `<button class="btn-main" style="background:#7f8c8d;" onclick="togglePause()">ПАУЗА</button>`;
        
        fightInterval = setInterval(() => {
            if (isPaused || isGameOver) return;

            // Игрок бьет
            enemy.hp -= player.atk;
            document.getElementById('e-hp-bar').style.width = Math.max(0, (enemy.hp / enemy.maxHp * 100)) + "%";
            
            if (enemy.hp <= 0) {
                clearInterval(fightInterval);
                winBattle();
                return;
            }

            // Враг бьет
            changeStats(-enemy.atk);
            
        }, 800);
    }

    function winBattle() {
        document.getElementById('enemy-sprite').style.display = 'none';
        changeStats(0, 20);
        endEvent("Враг повержен! Вы нашли 20 золотых.");
    }

    function retreat() {
        changeStats(-10);
        document.getElementById('enemy-sprite').style.display = 'none';
        if (!isGameOver) endEvent("Вы обошли опасность, но поранились о колючки.");
    }

    function endEvent(msg) {
        document.getElementById('story-box').innerHTML += `<br><br><em>${msg}</em>`;
        showMainButton();
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.querySelector('#action-panel button');
        btn.innerText = isPaused ? "ПРОДОЛЖИТЬ" : "ПАУЗА";
    }
</script>

</body>
</html>
